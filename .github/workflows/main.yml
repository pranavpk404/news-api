name: Scrape latest data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours — 12 runs/day

concurrency:
  group: scrape-latest-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scheduled:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run scraper
      env:
        NEWSAPI_KEYS: ${{ secrets.NEWSAPI_KEYS }}
        FIRSTAPI:  ${{ secrets.FIRSTAPI }}
        SECONDAPI: ${{ secrets.SECONDAPI }}
        THIRDAPI:  ${{ secrets.THIRDAPI }}
        FOURTHAPI: ${{ secrets.FOURTHAPI }}
        FIFTHAPI:  ${{ secrets.FIFTHAPI }}
        SIXTHAPI:  ${{ secrets.SIXTHAPI }}
        SEVENTHAPI: ${{ secrets.SEVENTHAPI }}
      run: python main.py

    - name: Commit and push if changed
      run: |
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No generated data changed."
          exit 0
        fi
        timestamp=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        git commit -m "Latest data: ${timestamp}"
        git push
